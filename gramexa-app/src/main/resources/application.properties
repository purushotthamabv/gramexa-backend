spring.application.name=gramexa-app
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/gramexa_db}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=${DATABASE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
server.port=${PORT:8080}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

# Development-only fallback. Production overrides this property and requires JWT_SECRET.
jwt.secret=${JWT_SECRET:local-development-jwt-secret-change-me-32-bytes}
